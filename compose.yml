services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: coursaty-api

    restart: unless-stopped

    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379

    ports:
      - "127.0.0.1:3001:3000"

    mem_limit: 1g

    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine

    container_name: coursaty-redis

    restart: unless-stopped

    command:
      - redis-server
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - allkeys-lru

    mem_limit: 128m

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
